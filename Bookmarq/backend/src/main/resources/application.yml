# ─── Bookstore Application Configuration ───────────────────
# Common settings shared across all profiles.

spring:
  profiles:
    active: local
  application:
    name: bookstore

  # JPA — Hibernate validates against Flyway-managed schema
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Servlet
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # Mail — Gmail's free SMTP relay (smtp.gmail.com). Requires an app password,
  # not the regular account password: https://myaccount.google.com/apppasswords
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  tomcat:
    # Must exceed max-request-size so Tomcat can fully swallow an oversized multipart body
    # and let Spring respond with a clean 413 JSON error, instead of resetting the connection
    # mid-upload (the default max-swallow-size equals max-request-size, which is too small).
    max-swallow-size: 20MB

# ─── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── OpenAPI / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ─── Application custom properties ─────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-is-at-least-64-bytes-long-for-hs512-algorithm-needs}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size-bytes: 2097152  # 2 MB
  mail:
    from: ${MAIL_FROM:Bookmarq <noreply@bookmarq.com>}
    enabled: ${MAIL_ENABLED:true}
