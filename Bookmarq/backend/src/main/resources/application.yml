# ─── Bookstore Application Configuration ───────────────────
# Common settings shared across all profiles.

spring:
  profiles:
    active: local
  application:
    name: bookstore

  # JPA — Hibernate validates against Flyway-managed schema
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Servlet
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

# ─── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── OpenAPI / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ─── Application custom properties ─────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-is-at-least-64-bytes-long-for-hs512-algorithm-needs}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size-bytes: 2097152  # 2 MB
